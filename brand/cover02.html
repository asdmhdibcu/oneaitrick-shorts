<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      html, body { width: 1080px; height: 1920px; margin: 0; }
      .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: radial-gradient(ellipse 95% 60% at 30% 55%, #2c2434 0%, #18151f 55%, #0b0c10 100%); }
      .bar { position: absolute; left: 0; top: 0; height: 10px; width: 1080px; background: var(--accent); }
      /* Instagram grid crops to the centre 1080x1440: keep everything inside y 240-1680 */
      .tagw { position: absolute; left: 80px; top: 300px; }
      .tag { font-size: 32px; padding: 14px 28px 14px 22px; }
      .tag .dot { width: 16px; height: 16px; background: #7cc4ff; }
      .title { position: absolute; left: 80px; right: 60px; top: 390px; font-size: 150px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.93; color: var(--ink); }
      .title em { font-style: normal; color: #ff7ac6; text-shadow: 0 0 60px rgba(255,122,198,0.45); }
      .lamp { position: absolute; left: -200px; top: 760px; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255,181,71,0.26), rgba(255,181,71,0)); }
      .im { position: absolute; }
      .rob { position: absolute; left: 150px; top: 860px; width: 470px; height: 470px; }
      .rob img { width: 100%; height: 100%; }
      .eye { position: absolute; top: 170px; width: 40px; height: 75px; border-radius: 20px; background: #c8ff4d;
        box-shadow: 0 0 24px #c8ff4d, 0 0 56px #c8ff4d; }
      .dtop { position: absolute; left: 0; top: 1270px; width: 1080px; height: 92px;
        background: linear-gradient(180deg, #4a4058 0%, #352e40 100%); clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%); }
      .dfront { position: absolute; left: 0; top: 1360px; width: 1080px; height: 330px; background: linear-gradient(180deg, #221d2a, #0b0c10); }
      .dfront .strip { position: absolute; left: 70px; right: 70px; top: 26px; height: 7px; border-radius: 4px; background: #c8ff4d; box-shadow: 0 0 26px rgba(200,255,77,0.7); opacity: 0.8; }
      .ink { position: absolute; left: 790px; top: 1085px; transform: translate(-50%, -50%) rotate(-10deg); border: 8px solid #c8ff4d; border-radius: 18px; padding: 8px 26px 12px;
        color: #c8ff4d; text-align: center; font-weight: 900; line-height: 0.95; background: #0f1116;
        text-shadow: 0 0 24px rgba(200,255,77,0.5); box-shadow: 0 0 0 5px #0f1116, 0 14px 40px rgba(0,0,0,0.45), 0 0 50px rgba(200,255,77,0.35); }
      .ink .a { display: block; font-size: 84px; letter-spacing: -0.03em; }
      .ink .b { display: block; font-family: "Mono", monospace; font-size: 34px; letter-spacing: 0.06em; margin-top: 4px; }
      .pill { position: absolute; transform: translateX(-50%); white-space: nowrap; font-family: "Mono", monospace; font-weight: 700; font-size: 34px;
        letter-spacing: 0.1em; padding: 14px 26px; border-radius: 16px; background: rgba(11,12,16,0.85); border: 3px solid currentColor; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid" style="opacity: 0.35"></div>
      <div class="bar"></div>
      <div class="lamp"></div>
      <div class="tagw"><span class="tag"><span class="dot"></span>AI CONCEPT · STORY</span></div>
      <div class="title">Your AI<br />obeyed a<br /><em>stranger</em></div>
      <!-- stranger behind, pink rim light -->
      <img class="im" src="../library/3d/stranger.png" style="left: 700px; top: 700px; width: 300px; filter: drop-shadow(0 0 16px #ff7ac6) drop-shadow(0 0 50px rgba(255,122,198,0.6))" />
      <!-- assistant, lime eyes = protected -->
      <div class="rob"><img src="../library/3d/robot.png" /><div class="eye" style="left: 137px"></div><div class="eye" style="left: 296px"></div></div>
      <div class="dtop"></div>
      <div class="dfront"><div class="strip"></div></div>
      <!-- the stranger's letter, stamped -->
      <img class="im" src="../library/3d/paper.png" style="left: 680px; top: 950px; width: 240px; transform: rotate(-6deg); filter: drop-shadow(0 0 22px #ff7ac6) drop-shadow(0 0 60px rgba(255,122,198,0.6))" />
      <div class="ink"><span class="a">READ</span><span class="b">DON'T OBEY</span></div>
      <img class="im" src="../library/3d/coffee.png" style="left: 40px; top: 1200px; width: 150px" />
      <div class="pill" style="left: 540px; top: 1470px; color: var(--accent)">38 IN 100 → 1 IN 1,000</div>
      <div class="pill" style="left: 540px; top: 1570px; color: var(--muted); border-color: transparent; background: none; font-size: 30px">PROMPT INJECTION, EXPLAINED</div>
    </div>
  </body>
</html>
