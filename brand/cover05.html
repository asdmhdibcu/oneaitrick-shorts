<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      html, body { width: 1080px; height: 1920px; margin: 0; }
      .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden;
        background: linear-gradient(180deg, #0b0c10 0%, #0f1c26 38%, #163240 66%, #0b0c10 100%); }
      .bar { position: absolute; left: 0; top: 0; height: 10px; width: 1080px; background: var(--accent); }
      /* Instagram grid crops to the centre 1080x1440: keep everything inside y 240-1680 */
      .tagw { position: absolute; left: 80px; top: 300px; }
      .tag { font-size: 32px; padding: 14px 28px 14px 22px; }
      .tag .dot { width: 16px; height: 16px; background: #7cc4ff; }
      .title { position: absolute; left: 80px; right: 60px; top: 390px; font-size: 136px; font-weight: 900; letter-spacing: -0.05em; line-height: 0.95; color: var(--ink); }
      .title em { font-style: normal; color: var(--accent); text-shadow: 0 0 60px rgba(200,255,77,0.35); }
      .halo { position: absolute; left: 140px; top: 760px; width: 800px; height: 800px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(200,255,77,0.22), rgba(200,255,77,0)); }
      .floor { position: absolute; left: 0; top: 1330px; width: 1080px; height: 400px;
        background: radial-gradient(ellipse 60% 40% at 50% 10%, rgba(160,215,255,0.16), rgba(0,0,0,0)); }
      .im { position: absolute; }
      .desk { position: absolute; left: 170px; top: 1240px; width: 740px; height: 190px; }
      .desk .top { position: absolute; left: 0; top: 0; width: 100%; height: 44px; border-radius: 22px; background: linear-gradient(180deg, #f4f7fb, #c9d4e2); }
      .desk .front { position: absolute; left: 22px; top: 34px; right: 22px; bottom: 0; border-radius: 0 0 26px 26px; background: linear-gradient(180deg, #2a3647, #1a2230); }
      .desk .strip { position: absolute; left: 60px; right: 60px; top: 84px; height: 8px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 30px rgba(200,255,77,0.8); }
      .pill { position: absolute; transform: translateX(-50%); white-space: nowrap; font-family: "Mono", monospace; font-weight: 700; font-size: 34px;
        letter-spacing: 0.1em; padding: 14px 26px; border-radius: 16px; background: rgba(11,12,16,0.85); border: 3px solid currentColor; }
      .dim { filter: grayscale(1) brightness(0.45); }
      .lit { filter: drop-shadow(0 0 22px rgba(200,255,77,0.55)); }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="grid" style="opacity: 0.5"></div>
      <div class="bar"></div>
      <div class="tagw"><span class="tag"><span class="dot"></span>AI CONCEPT · STORY</span></div>
      <div class="title">The hospital<br />inside your <em>AI</em></div>
      <div class="halo"></div>
      <div class="floor"></div>
      <!-- back row of doctors: 4 lit, rest dimmed -->
      <img class="im dim" src="../library/3d/doc_dark.png" style="left: 20px; top: 860px; width: 190px" />
      <img class="im lit" src="../library/3d/doc_light.png" style="left: 170px; top: 820px; width: 210px" />
      <img class="im lit" src="../library/3d/mdoc_medium.png" style="left: 330px; top: 790px; width: 210px" />
      <img class="im lit" src="../library/3d/doc_mdark.png" style="left: 540px; top: 790px; width: 210px" />
      <img class="im lit" src="../library/3d/doc_mlight.png" style="left: 700px; top: 820px; width: 210px" />
      <img class="im dim" src="../library/3d/doc_light.png" style="left: 870px; top: 860px; width: 190px" />
      <!-- receptionist -->
      <img class="im" src="../library/3d/robot.png" style="left: 300px; top: 900px; width: 480px" />
      <div class="desk"><div class="top"></div><div class="front"></div><div class="strip"></div></div>
      <img class="im" src="../library/3d/bellhop.png" style="left: 720px; top: 1110px; width: 160px" />
      <div class="pill" style="left: 540px; top: 1500px; color: var(--accent)">ONLY 4 OF 50 DOCTORS</div>
      <div class="pill" style="left: 540px; top: 1600px; color: var(--muted); border-color: transparent; background: none; font-size: 30px">MIXTURE OF EXPERTS, EXPLAINED</div>
    </div>
  </body>
</html>
