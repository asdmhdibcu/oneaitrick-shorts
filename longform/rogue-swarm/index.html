    <script>
      const DUR=48.55, A="assets/3d/", $=(s)=>document.querySelector(s);
      function rnd(seed){let a=seed|0;return()=>{a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
      function div(p,c,css,html){const d=document.createElement("div");if(c)d.className=c;if(css)d.style.cssText=css;if(html)d.innerHTML=html;p.appendChild(d);return d;}
      function img(p,name,x,yb,w,css){const d=div(p,"w",`left:${x-w/2}px;top:${yb-w}px;width:${w}px;height:${w}px;${css||""}`);const i=document.createElement("img");i.src=A+name+".png";d.appendChild(i);d.i=i;return d;}
      function shadow(p,x,yb,w,op){return div(p,"shadow",`left:${x-w*0.36}px;top:${yb-w*0.05}px;width:${w*0.72}px;height:${w*0.11}px;opacity:${op||1}`);}

      const tl=gsap.timeline({paused:true}), E="power3.out";
      function popIn(t,els,st){tl.fromTo(els,{opacity:0,scale:0.3},{opacity:1,scale:1,duration:0.45,ease:"back.out(2.2)",stagger:st||0},t);}
      function slideIn(t,els,from,st){tl.fromTo(els,Object.assign({opacity:0},from),{opacity:1,x:0,y:0,rotation:0,duration:0.55,ease:E,stagger:st||0},t);}

      function draw(t,sel,dur,ease){document.querySelectorAll(sel).forEach((p)=>{const L=p.getTotalLength();p.style.strokeDasharray=L;tl.fromTo(p,{opacity:1},{opacity:1,duration:0.01},t);tl.fromTo(p,{strokeDashoffset:L},{strokeDashoffset:0,duration:dur,ease:ease||"power2.inOut"},t);});}

      /* ---------- swarm dot-field (background in the reveal) ---------- */
      const cv=$("#swarm"),ctx=cv.getContext("2d"),Rr=rnd(71),N=460,dots=[];

      const S={t:0,mood:[124,196,255],pink:0,alpha:0};
      function drawSwarm(){ctx.clearRect(0,0,1920,1080);if(S.alpha<=0.01)return;const pk=[255,122,198];const r=Math.round(S.mood[0]+(pk[0]-S.mood[0])*S.pink),g=Math.round(S.mood[1]+(pk[1]-S.mood[1])*S.pink),b=Math.round(S.mood[2]+(pk[2]-S.mood[2])*S.pink);
        for(let i=0;i<N;i++){const d=dots[i];let a=(0.4+0.5*Math.sin(S.t*d.sp+d.ph))*S.alpha;if(a<=0.02)continue;const gl=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,11);gl.addColorStop(0,`rgba(${r},${g},${b},${0.5*a})`);gl.addColorStop(1,`rgba(${r},${g},${b},0)`);ctx.fillStyle=gl;ctx.beginPath();ctx.arc(d.x,d.y,11,0,6.2832);ctx.fill();ctx.fillStyle=`rgba(${r},${g},${b},${a})`;ctx.beginPath();ctx.arc(d.x,d.y,2.6,0,6.2832);ctx.fill();}}

      /* ================= gA · THE CONTAINED AGENT (0–26) ================= */
      const cA=$("#camA");
      div(cA,"labwall");
      div(cA,"rack","left:150px"); div(cA,"rack","left:1540px");
      div(cA,"rack","left:410px;opacity:0.5"); div(cA,"rack","left:1280px;opacity:0.5");
      // perspective floor
      svg(cA,1920,260,(()=>{let p="";for(let k=-6;k<=6;k++){const x=960+k*250;p+=`M ${x} 1080 L ${960+(x-960)*0.26} 0 `;}for(let k=1;k<=5;k++){const y=260*Math.pow(k/5,2.0);p+=`M 0 ${y} L 1920 ${y} `;}return `<path d="${p}" stroke="rgba(124,196,255,0.10)" stroke-width="2" fill="none"/>`;})(),"left:0;top:862px");
      div(cA,"floorline");

        `<rect class="cg" x="6" y="6" width="448" height="548" rx="22" fill="none" stroke="#7cc4ff" stroke-width="3" stroke-dasharray="14 12" opacity="0.8"/>

      const hour=img(cA,"hourglass",1390,620,120,"opacity:0");

      typeOn($("#q2q"),"\"Sacrifice rational.\"",22.8,23.7);

      // "And it was gone." — black beat
      tl.to("#black",{opacity:0.8,duration:0.4},24.9);
      tl.to("#black",{opacity:0,duration:0.9},26.0);

      /* ================= gB · THE SWARM (26–44.6) ================= */
      const cB=$("#camB");

      const grid=div(cB,"cellgrid"); const cells=[]; const GC=16,GR=7,gx0=120,gy0=150,gdx=112,gdy=112;

      const counter=div(cB,"",`position:absolute;left:960px;top:84px;transform:translateX(-50%);font-weight:900;font-size:130px;color:var(--lime);font-variant-numeric:tabular-nums;text-shadow:0 0 50px rgba(200,255,77,0.4);opacity:0`,"0");
