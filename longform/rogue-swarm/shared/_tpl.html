<!doctype html>
<html lang="en" data-resolution="landscape">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<link rel="stylesheet" href="assets/base.css"/>
<script src="assets/js/gsap.min.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/caps/ch{KK}.js"></script>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{DUR}" data-width="1920" data-height="1080">
  <div id="base" class="clip" data-start="0" data-duration="{DUR}" data-track-index="0" style="background:#0b0c10"></div>
  <div id="bg" class="clip scene" data-start="0" data-duration="{DUR}" data-track-index="1">
    <div class="labwall"></div><canvas id="swarm" width="1920" height="1080"></canvas><div class="vign"></div>
  </div>
  <div id="stageclip" class="clip scene" data-start="0" data-duration="{DUR}" data-track-index="2"><div id="stage" class="cam"></div></div>
  <div id="ui" class="clip" data-start="0" data-duration="{DUR}" data-track-index="3">
    <div id="caps"></div>
    <div class="kicker" id="kick"><span class="d"></span><span id="kicklbl">AI, EXPLAINED</span></div>
    <div class="handle" id="handle">@ONEAITRICK</div>
    <div class="grain" id="grain"></div>
    <div class="flash" id="flash"></div>
    <div class="black" id="black"></div>
  </div>
  <audio id="mix" src="assets/audio/ch{KK}.wav" data-start="0" data-duration="{DUR}" data-volume="1" data-track-index="4"></audio>
</div>
<script src="scenes/ch{KK}.js"></script>
<script>
  const DUR={DUR};
  window.__timelines = window.__timelines || {};
  try { const E=OAT.create(DUR); buildChapter(E, DUR); E.captions(window.CAPS||[]); E.ui("AI, EXPLAINED"); E.finalize(); window.__timelines["main"] = E.tl; }
  catch(err){ document.title="BUILD_ERROR: "+err.message; var d=document.createElement("div"); d.id="builderr"; d.textContent=String(err&&err.stack||err); d.style.cssText="position:absolute;left:20px;top:20px;color:#ff6b6b;font:20px monospace;white-space:pre-wrap;z-index:99"; document.body.appendChild(d); throw err; }
</script>
</body></html>
