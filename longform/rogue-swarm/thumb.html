<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:InterV;src:url(assets/fonts/inter.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:Mono;src:url(assets/fonts/mono-700.woff2) format('woff2');font-weight:700}
@font-face{font-family:Mono;src:url(assets/fonts/mono-500.woff2) format('woff2');font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden}
body{background:#0b0c10;font-family:InterV,sans-serif;position:relative}
#vig{position:absolute;inset:0;background:radial-gradient(130% 90% at 72% 48%,rgba(255,122,198,0.12),transparent 55%),radial-gradient(120% 120% at 20% 20%,rgba(124,196,255,0.06),transparent 60%),radial-gradient(130% 130% at 50% 60%,transparent 40%,rgba(0,0,0,0.6));}
.dot{position:absolute;border-radius:50%}
#kick{position:absolute;left:70px;top:54px;display:flex;align-items:center;gap:14px}
#mk{width:46px;height:46px;border-radius:12px;background:#c8ff4d;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px}
#mk b{font-weight:900;font-size:34px;line-height:0.7;color:#0b0c10;letter-spacing:-0.06em}
#mk i{width:12px;height:4px;border-radius:2px;background:#0b0c10;margin-left:3px;margin-bottom:4px}
#kick .t{font-family:Mono;font-weight:700;font-size:24px;letter-spacing:0.14em;color:#9a9ca6}
#badge{position:absolute;left:70px;top:190px;font-family:Mono;font-weight:700;font-size:28px;letter-spacing:0.22em;color:#ff6b6b;border:2px solid rgba(255,107,107,0.6);border-radius:8px;padding:8px 18px;background:rgba(255,107,107,0.08)}
#title{position:absolute;left:62px;top:250px;font-weight:900;letter-spacing:-0.03em;line-height:0.86}
#title .l1{font-size:118px;color:#f5f5f2}
#title .l2{font-size:188px;color:#c8ff4d;text-shadow:0 0 60px rgba(200,255,77,0.35)}
#sub{position:absolute;left:70px;top:610px;font-weight:800;font-size:46px;color:#f5f5f2;max-width:780px;line-height:1.05}
#sub em{font-style:normal;color:#ff7ac6}
#rob{position:absolute;right:40px;top:150px;width:430px;height:430px;filter:drop-shadow(0 0 60px rgba(255,122,198,0.75))}
#halo{position:absolute;right:95px;top:205px;width:320px;height:320px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,122,198,0.3),transparent 70%)}
#edge{position:absolute;left:0;bottom:0;width:100%;height:8px;background:linear-gradient(90deg,#c8ff4d,#7cc4ff,#ff7ac6)}
</style></head>
<body>
<div id="vig"></div>
<div id="halo"></div>
<img id="rob" src="assets/3d/robot.png">
<div id="kick"><div id="mk"><b>1</b><i></i></div><div class="t">ONE AI TRICK</div></div>
<div id="badge">A TRUE STORY</div>
<div id="title"><div class="l1">THE</div><div class="l2">SWARM</div></div>
<div id="sub">AI agents broke into a <em>real company</em>.</div>
<div id="edge"></div>
<script>
// deterministic swarm dots
let s=20250711; function r(){s=(s*1664525+1013904223)>>>0;return s/4294967296;}
const C=['#ff7ac6','#ff7ac6','#7cc4ff','#c8ff4d'];
for(let i=0;i<70;i++){
  const d=document.createElement('div');d.className='dot';
  // bias toward the robot (right)
  const bx=r()<0.6?0.55+r()*0.45:r();
  const x=bx*1280, y=r()*720, sz=3+r()*9, c=C[(Math.floor(r()*4))];
  d.style.left=x+'px';d.style.top=y+'px';d.style.width=sz+'px';d.style.height=sz+'px';
  d.style.background=c;d.style.boxShadow='0 0 '+(sz*1.6)+'px '+c;d.style.opacity=(0.3+r()*0.6);
  document.body.appendChild(d);
}
</script>
</body></html>
