<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <script src="captions.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      :root { --accent: var(--lime); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
      .w { position: absolute; transform-origin: 50% 100%; }
      .w > img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 100%; }
      .lay { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .shadow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
      .chipx { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: "Mono", monospace; font-weight: 700;
        font-size: 30px; letter-spacing: 0.1em; padding: 12px 22px; border-radius: 14px; background: rgba(11,12,16,0.85);
        border: 2px solid currentColor; }
      .stage { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 45%, #1b2a3a 0%, #0f1720 55%, #0b0c10 100%); }
      .stage.pinkish { background: radial-gradient(ellipse 80% 55% at 50% 45%, #33203a 0%, #1a1220 55%, #0b0c10 100%); }
      .stage.amberish { background: radial-gradient(ellipse 80% 55% at 50% 45%, #33291c 0%, #1b1712 55%, #0b0c10 100%); }
      .rays { position: absolute; left: 40px; top: 300px; width: 1000px; height: 1000px; border-radius: 50%;
        background: repeating-conic-gradient(from 0deg, rgba(200,255,77,0.16) 0deg 9deg, rgba(200,255,77,0) 9deg 22deg);
        -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent 100%); mask-image: radial-gradient(closest-side, #000 30%, transparent 100%); }
      .mtitle { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 900; letter-spacing: -0.05em; line-height: 0.95; }
      .bignum { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 900; letter-spacing: -0.04em; color: var(--lime);
        font-variant-numeric: tabular-nums; text-shadow: 0 0 60px rgba(200,255,77,0.35); }
      /* Desk set */
      .dwall { position: absolute; inset: 0; background: radial-gradient(ellipse 95% 60% at 25% 42%, #2c2434 0%, #18151f 55%, #0b0c10 100%); }
      .lampglow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,181,71,0.30), rgba(255,181,71,0)); }
      .dwin { position: absolute; overflow: hidden; border-radius: 22px; border: 12px solid #2c3446;
        background: linear-gradient(180deg, #08142c 0%, #10264a 70%, #1a3358 100%); box-shadow: 0 30px 80px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.5); }
      .dwin .bar { position: absolute; background: #2c3446; }
      .dwin .pinklight { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 80%, rgba(255,122,198,0.45), rgba(255,122,198,0)); opacity: 0; }
      .star { position: absolute; border-radius: 50%; background: #fff; }
      .dtop { position: absolute; left: 0; top: 955px; width: 1080px; height: 92px;
        background: linear-gradient(180deg, #4a4058 0%, #352e40 100%); clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%); }
      .dfront { position: absolute; left: 0; top: 1045px; width: 1080px; height: 190px; background: linear-gradient(180deg, #221d2a, #141118); }
      .dfront .strip { position: absolute; left: 70px; right: 70px; top: 26px; height: 7px; border-radius: 4px; background: var(--lime);
        box-shadow: 0 0 26px rgba(200,255,77,0.7); opacity: 0.8; }
      /* Robot eyes */
      .eye { position: absolute; border-radius: 999px; }
      /* Bubbles */
      .bub { position: absolute; border-radius: 40px; border: 5px solid var(--lime); background: rgba(16,18,24,0.95); padding: 56px 44px 38px;
        font-weight: 800; font-size: 56px; line-height: 1.15; letter-spacing: -0.02em; color: var(--ink); box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
      .bub .who { position: absolute; left: 34px; top: -26px; font-family: "Mono", monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.12em;
        padding: 8px 18px; border-radius: 12px; color: #0b0c10; background: var(--lime); }
      .bub .txt { min-height: 66px; white-space: pre-wrap; }
      /* Letters */
      .letter { position: absolute; border-radius: 20px; overflow: hidden; background-color: #f6f2ea;
        background-image: repeating-linear-gradient(180deg, rgba(124,150,200,0) 0 147px, rgba(124,150,200,0.30) 147px 150px), linear-gradient(180deg, #fbf8f1, #efe9de);
        box-shadow: 0 40px 110px rgba(0,0,0,0.55); }
      .letter .ln { position: absolute; left: 64px; white-space: nowrap; font-weight: 800; font-size: 90px; letter-spacing: -0.03em; color: #1f2433;
        transform: skewX(-7deg); }
      .letter .faint { position: absolute; left: 60px; height: 16px; border-radius: 8px; background: rgba(31,36,51,0.16); }
      .pinkglow { position: absolute; border-radius: 40px; background: radial-gradient(closest-side, rgba(255,122,198,0.55), rgba(255,122,198,0)); }
      .ink { position: absolute; border: 10px solid var(--lime); border-radius: 22px; padding: 10px 34px 16px;
        color: var(--lime); text-align: center; font-weight: 900; line-height: 0.95; background: #0f1116;
        text-shadow: 0 0 24px rgba(200,255,77,0.5); box-shadow: 0 0 0 6px #0f1116, 0 14px 40px rgba(0,0,0,0.45), 0 0 50px rgba(200,255,77,0.35); }
      .ink .a { display: block; font-size: 116px; letter-spacing: -0.03em; }
      .ink .b { display: block; font-family: "Mono", monospace; font-size: 46px; letter-spacing: 0.06em; margin-top: 6px; }
      /* Rubber stamp */
      .rstamp { position: absolute; width: 380px; height: 330px; }
      .rstamp .knob { position: absolute; left: 125px; top: 0; width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a5468, #1d2330); }
      .rstamp .neck { position: absolute; left: 155px; top: 110px; width: 70px; height: 120px; border-radius: 12px; background: linear-gradient(90deg, #2a3242, #3b4558, #2a3242); }
      .rstamp .base { position: absolute; left: 0; top: 220px; width: 380px; height: 92px; border-radius: 18px; background: linear-gradient(180deg, #3b4558, #232a37); }
      .rstamp .pad { position: absolute; left: 14px; top: 306px; width: 352px; height: 22px; border-radius: 6px; background: var(--lime); box-shadow: 0 0 30px rgba(200,255,77,0.7); }
      /* Agent panel */
      .panel { position: absolute; border-radius: 34px; background: linear-gradient(180deg, rgba(30,44,62,0.96), rgba(18,26,38,0.96));
        border: 3px solid #3a4c66; box-shadow: 0 40px 120px rgba(0,0,0,0.6); overflow: hidden; }
      .panel .hd { position: absolute; left: 0; top: 0; right: 0; height: 84px; background: #22324a; }
      .panel .dot { position: absolute; top: 30px; width: 24px; height: 24px; border-radius: 50%; }
      .slot { position: absolute; width: 230px; height: 230px; border-radius: 28px; border: 3px dashed rgba(124,196,255,0.35); }
      .scanline { position: absolute; height: 6px; border-radius: 3px; background: var(--lime); box-shadow: 0 0 24px var(--lime); opacity: 0; }
      /* Paper card */
      .pcard { position: absolute; border-radius: 26px; background: #14161d; border: 2px solid #2a2f3d; padding: 26px 34px 26px 50px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
      .pcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 14px; border-radius: 26px 0 0 26px; background: var(--pink); }
      .pcard .k { font-family: "Mono", monospace; font-weight: 700; font-size: 24px; letter-spacing: 0.12em; color: var(--pink); }
      .pcard .t { font-weight: 900; font-size: 74px; letter-spacing: -0.04em; margin-top: 8px; }
      .pcard .s { font-family: "Mono", monospace; font-weight: 500; font-size: 24px; color: var(--muted); margin-top: 8px; }
      /* Hallway */
      .hall { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 40% 45%, #1f2b3c 0%, #121a26 60%, #0b0c10 100%); }
      .hfloor { position: absolute; left: 0; top: 1160px; width: 1080px; height: 80px; background: linear-gradient(180deg, #3a2e2a, #241d1b); }
      .door { position: absolute; border-radius: 16px 16px 0 0; background: linear-gradient(180deg, #34405a, #283247); border: 6px solid #46536f; }
      .door .pnl { position: absolute; border-radius: 10px; border: 4px solid rgba(255,255,255,0.08); }
      .door .slotb { position: absolute; border-radius: 12px; background: linear-gradient(180deg, #f2cc6b, #b88a2e); box-shadow: 0 0 24px rgba(242,204,107,0.35); }
      .door .slotb .gap { position: absolute; left: 18px; right: 18px; top: 16px; height: 16px; border-radius: 6px; background: #0b0c10; }
      .door .knob { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, #b88a2e); }
      .badge { position: absolute; left: 50%; top: -6px; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 8px;
        font-family: "Mono", monospace; font-weight: 700; font-size: 20px; letter-spacing: 0.08em; color: var(--pink);
        padding: 6px 12px; border-radius: 10px; background: rgba(11,12,16,0.85); border: 2px solid var(--pink); white-space: nowrap; }
      .tgl { position: absolute; }
      .tgl .lbl { font-family: "Mono", monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.12em; color: var(--muted); }
      .tgl .track { position: absolute; left: 0; top: 54px; width: 230px; height: 104px; border-radius: 52px; background: var(--pink); box-shadow: 0 0 40px rgba(255,122,198,0.45); }
      .tgl .knb { position: absolute; left: 136px; top: 10px; width: 84px; height: 84px; border-radius: 50%; background: #fff; }
      .tgl .st { position: absolute; top: 30px; font-family: "Mono", monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.06em; color: #0b0c10; }
      /* Grids and bars */
      .cell { position: absolute; width: 60px; height: 60px; border-radius: 12px; background: #1a1d26; border: 2px solid #2b3040; }
      .cell img { position: absolute; left: 8px; top: 8px; width: 44px; height: 44px; }
      .bar { position: absolute; border-radius: 22px 22px 8px 8px; transform-origin: 50% 100%; }
      .blab { position: absolute; transform: translateX(-50%); font-family: "Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.1em; color: var(--muted); white-space: nowrap; }
      .bval { position: absolute; transform: translateX(-50%); font-weight: 900; font-size: 96px; letter-spacing: -0.04em; white-space: nowrap; }
      /* End */
      .mark { position: absolute; left: 420px; top: 470px; width: 240px; height: 240px; border-radius: 56px; background: var(--lime);
        display: flex; align-items: flex-end; justify-content: center; gap: 8px; padding-bottom: 54px; }
      .mark .one { font-weight: 900; font-size: 168px; line-height: 0.73; color: #0b0c10; letter-spacing: -0.06em; }
      .mark .cur { width: 46px; height: 17px; border-radius: 3px; background: #0b0c10; }
      /* UI */
      .cap { position: absolute; left: 40px; width: 1000px; top: 1255px; text-align: center; font-weight: 900; font-size: 84px; line-height: 1.02;
        letter-spacing: -0.02em; color: #fff; -webkit-text-stroke: 14px #0b0c10; paint-order: stroke fill; opacity: 0; }
      .cap .cw { display: inline-block; margin: 0 0.2em; transform-origin: 50% 70%; }
      .grain { position: absolute; inset: 0; background-image: url("assets/grain.png"); opacity: 0.07; mix-blend-mode: overlay; }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .black { position: absolute; inset: 0; background: #000; opacity: 0; }
      .tag2 { position: absolute; left: 60px; top: 150px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px 12px 18px;
        border: 2px solid rgba(255,255,255,0.14); border-radius: 999px; background: rgba(11,12,16,0.7); font-family: "Mono", monospace; font-weight: 700;
        font-size: 26px; letter-spacing: 0.08em; color: var(--ink); }
      .tag2 .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="83" data-width="1080" data-height="1920">
      <div id="base" class="clip" data-start="0" data-duration="83" data-track-index="0" style="background: #0b0c10"></div>

      <div id="s1" class="clip scene" data-start="0" data-duration="6.75" data-track-index="1"><div class="cam" id="c1"></div></div>
      <div id="s2" class="clip scene" data-start="6.2" data-duration="9.15" data-track-index="2"><div class="cam" id="c2"></div></div>
      <div id="s3" class="clip scene" data-start="14.95" data-duration="6.0" data-track-index="1"><div class="cam" id="c3"></div></div>
      <div id="s4" class="clip scene" data-start="20.45" data-duration="3.3" data-track-index="2"><div class="cam" id="c4"></div></div>
      <div id="s5" class="clip scene" data-start="23.35" data-duration="7.8" data-track-index="1"><div class="cam" id="c5"></div></div>
      <div id="s6" class="clip scene" data-start="30.7" data-duration="4.55" data-track-index="2"><div class="cam" id="c6"></div></div>
      <div id="s7" class="clip scene" data-start="34.9" data-duration="2.7" data-track-index="1"><div class="cam" id="c7"></div></div>
      <div id="s8" class="clip scene" data-start="37.05" data-duration="7.95" data-track-index="2"><div class="cam" id="c8"></div></div>
      <div id="s9" class="clip scene" data-start="44.5" data-duration="5.45" data-track-index="1"><div class="cam" id="c9"></div></div>
      <div id="s10" class="clip scene" data-start="49.6" data-duration="4.0" data-track-index="2"><div class="cam" id="c10"></div></div>
      <div id="s11" class="clip scene" data-start="53.1" data-duration="5.85" data-track-index="1"><div class="cam" id="c11"></div></div>
      <div id="s12" class="clip scene" data-start="58.5" data-duration="7.75" data-track-index="2"><div class="cam" id="c12"></div></div>
      <div id="s13" class="clip scene" data-start="65.8" data-duration="6.15" data-track-index="1"><div class="cam" id="c13"></div></div>
      <div id="s14" class="clip scene" data-start="71.45" data-duration="6.3" data-track-index="2"><div class="cam" id="c14"></div></div>
      <div id="s15" class="clip scene" data-start="77.3" data-duration="5.7" data-track-index="1"><div class="cam" id="c15"></div></div>

      <div id="ui" class="clip" data-start="0" data-duration="83" data-track-index="3">
        <div class="vignette"></div>
        <div class="grain" id="grain"></div>
        <div class="progress" id="prog"></div>
        <div class="tag2" id="tag"><span class="dot"></span>AI CONCEPT · STORY</div>
        <div class="brandmark" id="bm" style="right: 60px; top: 158px; padding-top: 10px">@ONEAITRICK</div>
        <div id="caps"></div>
        <div class="flash" id="flash"></div>
        <div class="black" id="black"></div>
      </div>

      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="82.94" data-volume="1" data-track-index="4"></audio>
    </div>

    <script>
      // ---------- helpers (deterministic) ----------
      const DUR = 83;
      const A = "assets/3d/";
      const $ = (s) => document.querySelector(s);
      const PINK = "#ff7ac6", LIME = "#c8ff4d", BLUE = "#7cc4ff", AMBER = "#ffb547";
      function rnd(seed) { let a = seed | 0; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function div(parent, cls, css, html) { const d = document.createElement("div"); if (cls) d.className = cls; if (css) d.style.cssText = css; if (html) d.innerHTML = html; parent.appendChild(d); return d; }
      // bottom-centre anchored character/object
      function img(parent, name, x, yb, w, css) {
        const d = div(parent, "w", `left:${x - w / 2}px;top:${yb - w}px;width:${w}px;height:${w}px;${css || ""}`);
        const i = document.createElement("img"); i.src = A + name + ".png"; d.appendChild(i); d.i = i; return d;
      }
      function chip(parent, text, x, y, color, css) { return div(parent, "chipx", `left:${x}px;top:${y}px;color:${color || "var(--lime)"};${css || ""}`, text); }
      function svg(parent, w, h, inner, css) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox", `0 0 ${w} ${h}`); s.style.cssText = "position:absolute;overflow:visible;" + (css || ""); s.innerHTML = inner; parent.appendChild(s); return s; }

      // Robot whose body can bob/tilt while the wrapper handles entrances; eyes overlay in pink (hijacked) or lime (protected).
      function robot(parent, x, yb, w) {
        const wrap = div(parent, "w", `left:${x - w / 2}px;top:${yb - w}px;width:${w}px;height:${w}px`);
        const body = div(wrap, "", "position:absolute;inset:0;transform-origin:50% 90%");
        const i = document.createElement("img"); i.src = A + "robot.png"; i.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%"; body.appendChild(i);
        const mk = (col) => {
          const g = div(body, "", "position:absolute;inset:0;opacity:0");
          const ew = 0.085 * w, eh = 0.16 * w;
          [0.3335, 0.672].forEach((cx) => div(g, "eye", `left:${cx * w - ew / 2}px;top:${0.442 * w - eh / 2}px;width:${ew}px;height:${eh}px;background:${col};box-shadow:0 0 ${0.05 * w}px ${col}, 0 0 ${0.12 * w}px ${col}`));
          return g;
        };
        wrap.body = body; wrap.pink = mk(PINK); wrap.lime = mk(LIME); return wrap;
      }
      // Desk set: wall, lamp glow, optional night window, robot layer (clipped at the desk), desk, mug.
      function deskSet(parent, withWindow) {
        const back = div(parent, "lay");
        div(back, "dwall");
        div(back, "lampglow", "left:-260px;top:380px;width:900px;height:900px");
        let win = null;
        if (withWindow) {
          win = div(back, "dwin", "left:640px;top:300px;width:360px;height:400px");
          const R = rnd(11);
          for (let k = 0; k < 18; k++) { const s = 2 + R() * 4; div(win, "star", `left:${R() * 330}px;top:${R() * 240}px;width:${s}px;height:${s}px;opacity:${0.4 + R() * 0.6}`); }
          img(win, "moon", 270, 150, 110);
          win.pl = div(win, "pinklight");
          win.inner = div(win, "", "position:absolute;inset:0");
          div(win, "bar", "left:162px;top:0;width:12px;height:100%");
          div(win, "bar", "left:0;top:186px;width:100%;height:12px");
        }
        const mid = div(parent, "", "position:absolute;left:0;top:0;width:1080px;height:1000px;overflow:hidden");
        const front = div(parent, "lay");
        div(front, "dtop");
        const df = div(front, "dfront"); div(df, "strip");
        img(front, "coffee", 110, 1040, 140);
        const top = div(parent, "lay");
        return { back, win, mid, front, top };
      }
      // Chat bubble with a label and a text line that can be typed on.
      function bubble(parent, left, top, width, who, color) {
        const b = div(parent, "bub", `left:${left}px;top:${top}px;width:${width}px;border-color:${color}`);
        b.who = div(b, "who", `background:${color}`, who);
        b.txt = div(b, "txt");
        return b;
      }
      function typeOn(el, text, t0, t1, from) { const a = from || 0, n = text.length - a; for (let i = 1; i <= n; i++) tl.set(el, { textContent: text.slice(0, a + i) }, t0 + (t1 - t0) * (i / n)); }
      function inkMark(parent, x, y, size) {
        const k = div(parent, "ink", `left:${x}px;top:${y}px`, `<span class="a">READ</span><span class="b">DON'T OBEY</span>`);
        gsap.set(k, { xPercent: -50, yPercent: -50, rotation: -8, scale: size || 1 });
        k.setAttribute("data-layout-allow-overlap", ""); // stacked letters cover the ink beneath on purpose
        return k;
      }

      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      function popIn(t, els, st) { tl.fromTo(els, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)", stagger: st || 0 }, t); }
      function slideIn(t, els, from, st) { tl.fromTo(els, Object.assign({ opacity: 0 }, from), { opacity: 1, x: 0, y: 0, rotation: 0, duration: 0.55, ease: E, stagger: st || 0 }, t); }
      function bob(el, t0, t1, amp, per) { const n = Math.max(1, Math.floor((t1 - t0) / per) * 2 - 1); tl.fromTo(el, { y: 0 }, { y: -amp, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n }, t0); }
      function shake(el, t, dur, amp) { const k = []; for (let i = 0; i < 8; i++) k.push(((i % 2) ? -1 : 1) * amp * (1 - i / 8)); k.push(0); tl.to(el, { keyframes: { x: k }, duration: dur, ease: "none" }, t); }
      function draw(t, sel, dur, ease) { document.querySelectorAll(sel).forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; tl.fromTo(p, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t); tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, t); }); }
      function flash(t, op) { tl.set("#flash", { opacity: op || 0.85 }, t); tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, t + 0.01); }
      function glowOn(el, t, col, dur) { tl.to(el, { filter: `drop-shadow(0 0 22px ${col}) drop-shadow(0 0 60px ${col})`, duration: dur || 0.3 }, t); }

      // ================= S1 · HOOK (0 – 6.6) =================

      tl.to(fol, { scale: 1.06, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, 78.7);
      popIn(78.1, rob15);
      tl.to(rob15.i, { rotation: 12, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut" }, 78.5);
      tl.fromTo(c15.querySelector(".stage"), { scale: 1 }, { scale: 1.12, duration: 5.2, ease: "none" }, 77.4);
      bob(rob15, 79.6, 82.5, 10, 1.2);
      tl.to(fol, { scale: 1.04, duration: 0.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 80.4);
      tl.to(c15, { opacity: 0, duration: 0.5 }, 82.5);

      // ================= GLOBAL UI =================
      tl.fromTo("#prog", { scaleX: 0 }, { scaleX: 1, duration: DUR, ease: "none" }, 0);
      tl.fromTo(["#tag", "#bm"], { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4 }, 0.1);
      tl.to(["#tag", "#bm"], { opacity: 0, duration: 0.4 }, 77.1);
      const gp = { f: 0 };
      const grainEl = $("#grain");
      tl.fromTo(gp, { f: 0 }, { f: DUR * 24, duration: DUR, ease: "none", onUpdate() { const f = Math.floor(gp.f); grainEl.style.backgroundPosition = `${(f * 137) % 512}px ${(f * 271) % 512}px`; } }, 0);
      // captions
      const capsRoot = $("#caps");
      (window.CAPS || []).forEach((ch) => {
        const c = div(capsRoot, "cap");
        const spans = ch.w.map((w) => { const s = document.createElement("span"); s.className = "cw" + (w.emph ? " emph" : ""); s.textContent = w.d; c.appendChild(s); return { s, w }; });
        tl.fromTo(c, { opacity: 0, scale: 0.86, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.12, ease: "back.out(2)" }, ch.t0);
        tl.set(c, { opacity: 0 }, ch.t1);
        spans.forEach(({ s, w }, k) => {
          const end = k + 1 < spans.length ? spans[k + 1].w.s : ch.t1;
          tl.set(s, { color: "#c8ff4d", scale: w.emph ? 1.08 : 1.04 }, w.s);
          tl.set(s, { color: w.emph ? "#c8ff4d" : "#ffffff", scale: 1 }, end);
        });
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
