<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <script src="captions.js"></script>
    <link rel="stylesheet" href="assets/base.css" />
    <style>
      :root { --accent: var(--lime); }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .cam { position: absolute; inset: 0; transform-origin: 50% 45%; }
      .w { position: absolute; transform-origin: 50% 100%; }
      .w > img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 50% 100%; }
      .shadow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,0.6), rgba(0,0,0,0)); }
      .chipx { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-family: "Mono", monospace; font-weight: 700;
        font-size: 30px; letter-spacing: 0.1em; padding: 12px 22px; border-radius: 14px; background: rgba(11,12,16,0.82);
        border: 2px solid currentColor; }
      .glowdot { position: absolute; border-radius: 50%; }
      /* Lobby */
      .wall { position: absolute; left: 0; top: 0; width: 1080px; height: 1100px;
        background: linear-gradient(180deg, #0b131b 0%, #10212c 45%, #163240 78%, #0f1d27 100%); }
      .winp { position: absolute; top: 380px; width: 230px; height: 560px; border-radius: 22px;
        background: linear-gradient(180deg, rgba(160,215,255,0.28), rgba(124,196,255,0.06)); border: 3px solid rgba(160,215,255,0.18); }
      .winp::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: rgba(160,215,255,0.16); }
      .ceil { position: absolute; top: 255px; height: 12px; width: 300px; border-radius: 6px; background: #e9f6ff;
        box-shadow: 0 0 40px 12px rgba(190,230,255,0.45), 0 0 120px 30px rgba(124,196,255,0.18); }
      .cross { position: absolute; left: 490px; top: 300px; width: 100px; height: 100px; }
      .cross::before, .cross::after { content: ""; position: absolute; background: var(--lime); border-radius: 8px;
        box-shadow: 0 0 30px rgba(200,255,77,0.8), 0 0 80px rgba(200,255,77,0.35); }
      .cross::before { left: 36px; top: 0; width: 28px; height: 100px; }
      .cross::after { left: 0; top: 36px; width: 100px; height: 28px; }
      .floor { position: absolute; left: 0; top: 1060px; width: 1080px; height: 860px;
        background: linear-gradient(180deg, #1b3644 0%, #12222c 40%, #0b0c10 100%); }
      .floorsheen { position: absolute; left: 140px; top: 1080px; width: 800px; height: 260px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(160,215,255,0.14), rgba(160,215,255,0)); }
      /* Stage */
      .stage { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 55% at 50% 45%, #1b2a3a 0%, #0f1720 55%, #0b0c10 100%); }
      .spot { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,0.13), rgba(255,255,255,0)); }
      .rays { position: absolute; left: 40px; top: 400px; width: 1000px; height: 1000px; border-radius: 50%;
        background: repeating-conic-gradient(from 0deg, rgba(200,255,77,0.16) 0deg 9deg, rgba(200,255,77,0) 9deg 22deg);
        -webkit-mask-image: radial-gradient(closest-side, #000 30%, transparent 100%); mask-image: radial-gradient(closest-side, #000 30%, transparent 100%); }
      /* AI grid */
      .node { position: absolute; width: 72px; height: 72px; }
      .node img { width: 72px; height: 72px; filter: grayscale(1) brightness(0.55); }
      .node .ring { position: absolute; left: -10px; top: -10px; width: 92px; height: 92px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(200,255,77,0.55), rgba(200,255,77,0)); opacity: 0; }
      .bubble-txt { position: absolute; left: 0; top: 70px; width: 100%; text-align: center; font-family: "Mono", monospace; font-weight: 700;
        font-size: 54px; color: #2a2f3d; }
      /* Blueprint */
      .bp { position: absolute; inset: 0; background-color: #0c2440;
        background-image: linear-gradient(rgba(124,196,255,0.14) 2px, transparent 2px), linear-gradient(90deg, rgba(124,196,255,0.14) 2px, transparent 2px),
          linear-gradient(rgba(124,196,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(124,196,255,0.06) 1px, transparent 1px);
        background-size: 216px 216px, 216px 216px, 54px 54px, 54px 54px; }
      /* Desk */
      .desk { position: absolute; left: 150px; top: 960px; width: 780px; height: 230px; }
      .desk .top { position: absolute; left: 0; top: 0; width: 100%; height: 46px; border-radius: 23px;
        background: linear-gradient(180deg, #f4f7fb, #c9d4e2); }
      .desk .front { position: absolute; left: 22px; top: 36px; right: 22px; bottom: 0; border-radius: 0 0 26px 26px;
        background: linear-gradient(180deg, #2a3647, #1a2230); }
      .desk .strip { position: absolute; left: 60px; right: 60px; top: 92px; height: 8px; border-radius: 4px; background: var(--lime);
        box-shadow: 0 0 30px rgba(200,255,77,0.8); }
      .doorglow { position: absolute; border-radius: 30px; background: radial-gradient(closest-side, rgba(200,255,77,0.75), rgba(200,255,77,0)); opacity: 0; }
      .beam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0;
        background: linear-gradient(200deg, rgba(200,255,77,0) 30%, rgba(200,255,77,0.22) 55%, rgba(200,255,77,0) 80%);
        clip-path: polygon(560px 700px, 520px 700px, 0px 860px, 0px 1260px, 420px 1260px); }
      .scanline { position: absolute; left: 20px; width: 360px; height: 6px; background: var(--lime); box-shadow: 0 0 24px var(--lime); opacity: 0; }
      /* Building */
      .bld { position: absolute; left: 90px; top: 320px; width: 900px; height: 730px; border-radius: 34px;
        background: linear-gradient(180deg, #1d2a3b, #121a26); border: 3px solid #2f3d52; box-shadow: 0 40px 120px rgba(0,0,0,0.6); }
      .roof { position: absolute; left: 0; top: 0; width: 100%; height: 86px; border-radius: 31px 31px 0 0; background: #263449; }
      .room { position: absolute; width: 268px; height: 145px; border-radius: 18px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 20%, #3a4a5e 0%, #222e3e 70%); border: 2px solid #34445a; }
      .room.ours { border-color: var(--lime); box-shadow: 0 0 40px rgba(200,255,77,0.35) inset; }
      .room .rimg { position: absolute; bottom: -6px; }
      .etag { position: absolute; right: 8px; top: 8px; font-family: "Mono", monospace; font-weight: 700; font-size: 17px; letter-spacing: 0.08em;
        padding: 5px 9px; border-radius: 8px; background: rgba(11,12,16,0.85); color: var(--blue); border: 2px solid var(--blue); opacity: 0; }
      .mtitle { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 900; letter-spacing: -0.05em; line-height: 0.95; }
      /* Speed */
      .streak { position: absolute; height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.7)); }
      .tile { position: absolute; width: 270px; height: 330px; border-radius: 26px; background: #171f2b; border: 3px solid #2c394c; }
      .tile .tl { position: absolute; left: 0; bottom: 22px; width: 100%; text-align: center; font-family: "Mono", monospace; font-weight: 700;
        font-size: 30px; letter-spacing: 0.1em; color: var(--ink); }
      /* RAM */
      .ram { position: absolute; left: 110px; top: 700px; width: 860px; height: 230px; border-radius: 16px;
        background: linear-gradient(180deg, #1f7a4d, #145a38); border: 3px solid #2a9a62; }
      .ram .chipb { position: absolute; top: 40px; width: 80px; height: 120px; border-radius: 8px; background: linear-gradient(180deg, #1c1f26, #0d0f13); }
      .ram .pins { position: absolute; left: 30px; right: 30px; bottom: -3px; height: 28px;
        background: repeating-linear-gradient(90deg, #e2b84a 0 12px, transparent 12px 20px); }
      .meter { position: absolute; left: 110px; width: 860px; height: 64px; border-radius: 32px; background: #161b24; border: 3px solid #2b3445; overflow: hidden; }
      .meter .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: left center; }
      .meter .ml { position: absolute; left: 26px; top: 12px; font-family: "Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.08em; color: #0b0c10; }
      /* Data centre */
      .rack { position: absolute; border-radius: 6px; background-color: #121925; border: 2px solid #26334a;
        background-image: radial-gradient(circle, rgba(124,196,255,0.9) 0 2px, transparent 3px), linear-gradient(rgba(255,255,255,0.05) 2px, transparent 2px);
        background-size: 26px 30px, 100% 30px; }
      /* Lab */
      .labwall { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 35%, #2a2433 0%, #17141d 60%, #0b0c10 100%); }
      .board { position: absolute; left: 150px; top: 430px; width: 780px; height: 520px; border-radius: 22px; background: linear-gradient(180deg, #fbfbf8, #e9ebe6);
        border: 12px solid #c9ced6; box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
      .bulbglow { position: absolute; left: 340px; top: 180px; width: 400px; height: 400px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255,226,120,0.6), rgba(255,226,120,0)); opacity: 0; }
      /* Night */
      .sky { position: absolute; inset: 0; background: linear-gradient(180deg, #050a18 0%, #0b1730 45%, #14294a 75%, #0b0c10 100%); }
      .star { position: absolute; border-radius: 50%; background: #fff; }
      .pagerglow { position: absolute; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(closest-side, rgba(200,255,77,0.7), rgba(200,255,77,0)); opacity: 0; }
      .panel { position: absolute; left: 70px; top: 300px; width: 940px; height: 560px; border-radius: 34px;
        background: linear-gradient(180deg, rgba(30,44,62,0.96), rgba(18,26,38,0.96)); border: 3px solid #3a4c66; box-shadow: 0 40px 120px rgba(0,0,0,0.6); overflow: hidden; }
      .holo { filter: grayscale(1) brightness(1.7) drop-shadow(0 0 16px rgba(200,255,77,0.95)) drop-shadow(0 0 40px rgba(200,255,77,0.5)); }
      /* Result */
      .bignum { position: absolute; left: 0; width: 1080px; text-align: center; font-weight: 900; letter-spacing: -0.04em; color: var(--lime);
        font-variant-numeric: tabular-nums; text-shadow: 0 0 60px rgba(200,255,77,0.35); }
      .room2 { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 55% at 50% 40%, #2b2433 0%, #15121b 60%, #0b0c10 100%); }
      .tabletop { position: absolute; left: -40px; top: 1150px; width: 1160px; height: 90px; border-radius: 20px; background: linear-gradient(180deg, #8a5a3c, #5b3a27); }
      .screenin { position: absolute; overflow: hidden; border-radius: 10px; background: radial-gradient(ellipse at 50% 60%, #1a3550, #0c1828); }
      .stamp { position: absolute; padding: 14px 30px; border: 8px solid var(--lime); border-radius: 18px; color: var(--lime); font-weight: 900;
        font-size: 96px; letter-spacing: -0.03em; background: rgba(11,12,16,0.85); transform: translate(-50%, -50%) rotate(-6deg); }
      /* End */
      .mark { position: absolute; left: 420px; top: 470px; width: 240px; height: 240px; border-radius: 56px; background: var(--lime);
        display: flex; align-items: flex-end; justify-content: center; gap: 8px; padding-bottom: 54px; }
      .mark .one { font-weight: 900; font-size: 168px; line-height: 0.73; color: #0b0c10; letter-spacing: -0.06em; }
      .mark .cur { width: 46px; height: 17px; border-radius: 3px; background: #0b0c10; }
      /* UI */
      .cap { position: absolute; left: 40px; width: 1000px; top: 1255px; text-align: center; font-weight: 900; font-size: 84px; line-height: 1.02;
        letter-spacing: -0.02em; color: #fff; -webkit-text-stroke: 14px #0b0c10; paint-order: stroke fill; opacity: 0; }
      .cap .cw { display: inline-block; margin: 0 0.2em; transform-origin: 50% 70%; }
      .cap .cw.emph { color: #fff; }
      .grain { position: absolute; inset: 0; background-image: url("assets/grain.png"); opacity: 0.07; mix-blend-mode: overlay; }
      .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      .black { position: absolute; inset: 0; background: #000; opacity: 0; }
      .redflash { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(255,60,60,0) 30%, rgba(255,40,40,0.55) 100%); opacity: 0; }
      .tag2 { position: absolute; left: 60px; top: 150px; display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px 12px 18px;
        border: 2px solid rgba(255,255,255,0.14); border-radius: 999px; background: rgba(11,12,16,0.7); font-family: "Mono", monospace; font-weight: 700;
        font-size: 26px; letter-spacing: 0.08em; color: var(--ink); }
      .tag2 .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--blue); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="86" data-width="1080" data-height="1920">
      <div id="base" class="clip" data-start="0" data-duration="86" data-track-index="0" style="background: #0b0c10"></div>

      <div id="s1" class="clip scene" data-start="0" data-duration="6.9" data-track-index="1"><div class="cam" id="c1"></div></div>
      <div id="s2" class="clip scene" data-start="6.1" data-duration="5.9" data-track-index="2"><div class="cam" id="c2"></div></div>
      <div id="s3" class="clip scene" data-start="11.2" data-duration="8.6" data-track-index="1"><div class="cam" id="c3"></div></div>
      <div id="s4" class="clip scene" data-start="19.0" data-duration="3.9" data-track-index="2"><div class="cam" id="c4"></div></div>
      <div id="s5" class="clip scene" data-start="22.1" data-duration="6.4" data-track-index="1"><div class="cam" id="c5"></div></div>
      <div id="s6" class="clip scene" data-start="27.7" data-duration="10.9" data-track-index="2"><div class="cam" id="c6"></div></div>
      <div id="s8" class="clip scene" data-start="37.8" data-duration="7.2" data-track-index="1"><div class="cam" id="c8"></div></div>
      <div id="s9" class="clip scene" data-start="44.4" data-duration="11.7" data-track-index="2"><div class="cam" id="c9"></div></div>
      <div id="s10" class="clip scene" data-start="55.3" data-duration="4.4" data-track-index="1"><div class="cam" id="c10"></div></div>
      <div id="s11" class="clip scene" data-start="58.9" data-duration="9.5" data-track-index="2"><div class="cam" id="c11"></div></div>
      <div id="s12" class="clip scene" data-start="67.6" data-duration="10.3" data-track-index="1"><div class="cam" id="c12"></div></div>
      <div id="s13" class="clip scene" data-start="77.1" data-duration="5.6" data-track-index="2"><div class="cam" id="c13"></div></div>
      <div id="s14" class="clip scene" data-start="81.9" data-duration="4.1" data-track-index="1"><div class="cam" id="c14"></div></div>

      <div id="ui" class="clip" data-start="0" data-duration="86" data-track-index="3">
        <div class="redflash" id="redflash"></div>
        <div class="vignette"></div>
        <div class="grain" id="grain"></div>
        <div class="progress" id="prog"></div>
        <div class="tag2" id="tag"><span class="dot"></span>AI CONCEPT · STORY</div>
        <div class="brandmark" id="bm" style="right: 60px; top: 158px; padding-top: 10px">@ONEAITRICK</div>
        <div id="caps"></div>
        <div class="flash" id="flash"></div>
        <div class="black" id="black"></div>
      </div>

      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="86" data-volume="1" data-track-index="4"></audio>
    </div>

    <script>
      // ---------- helpers (deterministic) ----------
      const A = "assets/3d/";
      const $ = (s) => document.querySelector(s);
      function rnd(seed) { let a = seed | 0; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      function div(parent, cls, css, html) { const d = document.createElement("div"); if (cls) d.className = cls; if (css) d.style.cssText = css; if (html) d.innerHTML = html; parent.appendChild(d); return d; }
      // bottom-centre anchored character/object
      function img(parent, name, x, yb, w, css) {
        const d = div(parent, "w", `left:${x - w / 2}px;top:${yb - w}px;width:${w}px;height:${w}px;${css || ""}`);
        const i = document.createElement("img"); i.src = A + name + ".png"; d.appendChild(i); d.i = i; return d;
      }
      function shadow(parent, x, yb, w, op) { return div(parent, "shadow", `left:${x - w * 0.36}px;top:${yb - w * 0.06}px;width:${w * 0.72}px;height:${w * 0.12}px;opacity:${op || 1}`); }
      function chip(parent, text, x, y, color, css) { return div(parent, "chipx", `left:${x}px;top:${y}px;color:${color || "var(--lime)"};${css || ""}`, text); }
      function lobby(parent) {
        div(parent, "wall");
        [70, 425, 780].forEach((x) => div(parent, "winp", `left:${x}px`));
        [90, 390, 690].forEach((x) => div(parent, "ceil", `left:${x}px`));
        div(parent, "cross");
        div(parent, "floor");
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        s.setAttribute("width", "1080"); s.setAttribute("height", "860"); s.style.cssText = "position:absolute;left:0;top:1060px";
        let p = "";
        for (let k = -8; k <= 14; k++) { const xb = 540 + (k - 3) * 230; p += `M ${xb} 860 L ${540 + (xb - 540) * 0.18} 0 `; }
        for (let k = 1; k <= 7; k++) { const y = 860 * Math.pow(k / 7, 2.1); p += `M 0 ${y} L 1080 ${y} `; }
        s.innerHTML = `<path d="${p}" stroke="rgba(160,215,255,0.10)" stroke-width="2" fill="none"/>`;
        parent.appendChild(s);
        div(parent, "floorsheen");
      }
      function svg(parent, w, h, inner, css) { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox", `0 0 ${w} ${h}`); s.style.cssText = "position:absolute;" + (css || ""); s.innerHTML = inner; parent.appendChild(s); return s; }

      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      function popIn(t, els, st) { tl.fromTo(els, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)", stagger: st || 0 }, t); }
      function slideIn(t, els, from, st) { tl.fromTo(els, Object.assign({ opacity: 0 }, from), { opacity: 1, x: 0, y: 0, rotation: 0, duration: 0.55, ease: E, stagger: st || 0 }, t); }
      function bob(el, t0, t1, amp, per) { const n = Math.max(1, Math.floor((t1 - t0) / per) * 2 - 1); tl.fromTo(el, { y: 0 }, { y: -amp, duration: per / 2, ease: "sine.inOut", yoyo: true, repeat: n }, t0); }
      function shake(el, t, dur, amp) { const k = []; for (let i = 0; i < 8; i++) k.push(((i % 2) ? -1 : 1) * amp * (1 - i / 8)); k.push(0); tl.to(el, { keyframes: { x: k }, duration: dur, ease: "none" }, t); }
      function draw(t, sel, dur, ease) { document.querySelectorAll(sel).forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L; tl.fromTo(p, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, t); }); }

      const DOCS = ["doc_default", "doc_light", "doc_mlight", "doc_medium", "doc_mdark", "doc_dark", "mdoc_light", "mdoc_medium", "mdoc_dark", "wdoc_mlight", "wdoc_mdark", "wdoc_light"];

      // ================= S1 · HOOK (0 – 6.4) =================
      const c1 = $("#c1"); lobby(c1);
      const crowd = div(c1, "", "position:absolute;inset:0");
      const R1 = rnd(7);
      const crowdEls = [];
      [[930, 150, 9], [1010, 200, 7], [1110, 270, 6]].forEach(([yb, w, n], row) => {
        for (let i = 0; i < n; i++) {
          const x = 60 + i * (w * 0.62) + row * 30 + R1() * 30;
          const d = img(crowd, DOCS[(i * 5 + row * 3) % DOCS.length], x, yb + R1() * 20, w);
          d.style.zIndex = 10 + row; crowdEls.push([d, row, i]);
        }
      });
      const pat = div(c1, "", "position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:30");
      const patSh = shadow(pat, 760, 1232, 430);
      const crutch = img(pat, "crutch", 640, 1230, 300, "transform:rotate(-12deg)");
      const walker = img(pat, "walker", 760, 1235, 470);
      const bandage = img(pat, "bandage", 712, 1210, 120);
      const ring1 = div(pat, "", "position:absolute;left:640px;top:1100px;width:150px;height:150px;border-radius:50%;border:6px solid #ff6b6b;opacity:0");
      const flushed = img(pat, "flushed", 820, 760, 200);
      const x50 = chip(c1, "× 50 DOCTORS", 330, 690, "var(--lime)", "font-size:44px;z-index:40");
      // entrance: patient limps in from right
      tl.fromTo(pat, { x: 330 }, { x: 0, duration: 2.2, ease: "power1.out" }, 0);
      for (let k = 0; k < 6; k++) { tl.to(walker.i, { y: 16, rotation: -3, duration: 0.18, ease: "sine.in" }, 0.1 + k * 0.38); tl.to(walker.i, { y: 0, rotation: 1, duration: 0.2, ease: "sine.out" }, 0.28 + k * 0.38); }
      tl.fromTo(c1, { scale: 1.0 }, { scale: 1.08, duration: 6.4, ease: "none" }, 0);
      // "sprained ankle"
      popIn(2.6, bandage);
      tl.fromTo(ring1, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.2, duration: 0.4, ease: E }, 2.85);
